[build]
  command = "npm run build:seo"
  publish = "dist"

# SPA 路由回退（对不存在的路径回退到 index.html）
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 设置缓存策略
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
